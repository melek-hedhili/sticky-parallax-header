name: Release to NPM

on:
  workflow_dispatch:
    inputs:
      version:
        description: Confirm the prepared beta version in package.json
        required: true
        type: string
        default: 2.0.0-beta.2

permissions:
  contents: write

env:
  HUSKY: '0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify prepared beta release
        run: |
          node <<'NODE'
          const { version } = require('./package.json');
          if (process.env.GITHUB_REF !== 'refs/heads/master') {
            throw new Error('Releases must run from master.');
          }
          if (process.env.RELEASE_VERSION !== version) {
            throw new Error('Version confirmation must match package.json.');
          }
          if (!/^\d+\.\d+\.\d+-beta\.\d+$/.test(version)) {
            throw new Error('This workflow only publishes prepared beta versions.');
          }
          NODE
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn check:static
      - run: yarn test:ci
      - run: yarn test:types
      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git var GIT_COMMITTER_IDENT >/dev/null
      - name: Configure npm authentication
        uses: actions/setup-node@v7
        with:
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish manually requested release
        run: yarn release --ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
