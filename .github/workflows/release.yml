name: Release to NPM

on: workflow_dispatch

permissions:
  contents: write

env:
  HUSKY: '0'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn check:static
      - run: yarn test:ci
      - run: yarn test:types
      - name: Configure release identity
        run: |
          git config user.name "$RELEASE_USER_NAME"
          git config user.email "$RELEASE_USER_EMAIL"
        env:
          RELEASE_USER_NAME: ${{ secrets.USERNAME }}
          RELEASE_USER_EMAIL: ${{ secrets.USER_EMAIL }}
      - name: Publish manually requested release
        run: yarn release --ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
