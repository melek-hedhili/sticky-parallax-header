name: Run checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  HUSKY: '0'
  YARN_CACHE_FOLDER: ${{ runner.temp }}/yarn-cache

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global yarn@1.22.22
      - uses: actions/cache@v6
        with:
          path: ${{ env.YARN_CACHE_FOLDER }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock', 'demo/yarn.lock', 'docs/yarn.lock') }}
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn check:static
      - run: yarn test:ci
      - run: yarn test:types

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn --cwd demo install --frozen-lockfile --non-interactive
      - run: yarn --cwd demo generate:routes
      - run: yarn lint:demo
      - run: yarn demo:typecheck
      - run: yarn --cwd demo test:ci
      - run: yarn --cwd demo check:dependencies
      - run: yarn --cwd demo doctor
      - run: yarn --cwd demo build:bundles

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global yarn@1.22.22
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn --cwd docs install --frozen-lockfile --non-interactive
      - run: yarn lint:docs
      - run: yarn docs:typecheck
      - run: yarn --cwd docs build
